<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Croisée des Arts · Nouvelle façon d'apprendre gratuitement !</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"Roboto Mono"', 'ui-monospace', 'monospace'],
            serif: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          },
          colors: {
            primary: '#f8485e'
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-canvas: #111317;
      --bg-card: #181b21;
      --border-main: #262b35;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-primary: #f8485e;
    }

    body {
      background-color: #111317 !important;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      line-height: 1.6;
    }

    .font-mono, code, pre {
      font-family: 'Roboto Mono', monospace;
    }

    .gold-pill-active,
    .schdesign-pill-active,
    .btn-schdesign,
    .btn-gradient-primary {
      background: #f8485e !important;
      color: #ffffff !important;
      font-weight: 700;
      border: 1px solid #f8485e !important;
    }

    .card-black,
    .bg-\[\#15171c\],
    .bg-\[\#1b1e24\],
    .bg-\[\#1f2233\] {
      background-color: #181b21 !important;
      border-color: #262b35 !important;
    }

    .bg-\[\#0e0f12\],
    .bg-\[\#131417\] {
      background-color: #111317 !important;
      border-color: #262b35 !important;
    }

    .border-\[\#23262f\],
    .border-\[\#272b35\],
    .border-\[\#2b3553\] {
      border-color: #262b35 !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #111317;
    }
    ::-webkit-scrollbar-thumb {
      background: #262b35;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f8485e;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 1. ÉCRAN DE CONNEXION UNIQUE (3 RÔLES STRICTS : STAGIAIRE, VISITEUR, ADMIN) -->
  <div id="login-gate-view" class="min-h-screen flex items-center justify-center p-4 bg-[#111317]"></div>

  <!-- 2. BARRE SUPÉRIEURE SOBRE EN 3 ZONES (VISIBLE UNIQUEMENT APRÈS CONNEXION) -->
  <header id="app-top-header" class="hidden sticky top-0 z-40 bg-[#181b21]/95 backdrop-blur-md border-b border-[#262b35] px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <!-- Zone 1 : Identité Noir & Blanc -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="showTab(getProfileMeta(getActiveRole()).defaultTab)">
        <img src="assets/logo_croisee_nb.svg" alt="Logo Noir et Blanc La Croisée des Arts" onclick="if(typeof handleLogoEasterEggClick==='function')handleLogoEasterEggClick(event)" class="w-9 h-9 rounded-xl border border-white/80 bg-black object-contain shrink-0 select-none" />
        <div>
          <p class="font-bold text-sm text-white leading-tight">La Croisée des Arts</p>
          <p class="text-[11px] text-slate-400 leading-tight">Nouvelle façon d'apprendre gratuitement !</p>
        </div>
      </div>

      <!-- Zone 2 : Navigation Dynamique Selon le Rôle Connecté -->
      <nav id="role-main-nav" class="flex flex-wrap items-center gap-1.5"></nav>

      <!-- Zone 3 : Compte Connecté & Déconnexion -->
      <div id="role-switcher-container" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- 3. ESPACE DE TRAVAIL DYNAMIQUE SELON LE RÔLE (SANS BARRE LATÉRALE À GAUCHE) -->
  <main id="app-main-workspace" class="hidden flex-1 p-4 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

    <!-- RÔLE 1 : STAGIAIRE (SUIVI 4 SEMAINES J01-J20, BROCHURE GPO & COURS AUTORISÉS) -->
    <div id="content-stagiaire" class="tab-content hidden space-y-6">
      <div id="stagiaire-dashboard-container"></div>
    </div>

    <!-- RÔLE 2 : VISITEUR (DÉCOUVERTE MÉTIERS, ÉCOLES & PRIX, ACTU & NEWS, JOBS & STAGES) -->
    <div id="content-visiteur" class="tab-content hidden space-y-6">
      <div id="visiteur-workspace-container"></div>
    </div>

    <!-- RÔLE 3 : ADMIN (CONSOLE D'ADMINISTRATION GLOBALE, COMPTES, TUTEUR & ACCÈS COURS) -->
    <div id="content-admin" class="tab-content hidden space-y-6">
      <div id="admin-dashboard-container"></div>
    </div>

    <!-- VUE COURS : LECTURE DIRECTE EN PLEINE LARGEUR (RÉSERVÉE AUX STAGIAIRES & ADMIN) -->
    <div id="content-cours" class="tab-content hidden space-y-6">
      <div id="course-detail" class="w-full max-w-5xl mx-auto space-y-6"></div>
    </div>

    <!-- VUE TECHNIQUES : MÉDIUMS TRADITIONNELS & PAPIER -->
    <div id="content-techniques" class="tab-content hidden space-y-6">
      <div id="techniques-workspace-container"></div>
    </div>

    <!-- VUE 24 FICHES MÉTIERS (SANS IMAGES ARTIFICIELLES, LIENS ÉCOLES CLIQUABLES) -->
    <div id="content-metiers" class="tab-content hidden space-y-6">
      <div id="metiers-workspace-container"></div>
    </div>

    <!-- VUE ANNUAIRE DES 26 ÉCOLES & SITES (AVEC TARIFS & EXPLICATIONS GRATUIT / PAYANT) -->
    <div id="content-ecoles" class="tab-content hidden space-y-6">
      <div id="ecoles-workspace-container"></div>
    </div>

    <!-- VUE ACTU & NEWS EN FLUX CONTINU (LOGICIELS, NORMES ISO & ÉCOLES) -->
    <div id="content-veille" class="tab-content hidden space-y-6">
      <div id="veille-workspace-container"></div>
    </div>

    <!-- VUE JOBS & STAGES EN MODE CONNECTÉ -->
    <div id="content-jobs" class="tab-content hidden space-y-6">
      <div id="jobs-workspace-container"></div>
    </div>

    <!-- VUE EXPOSITION DES TRAVAUX D'ATELIER -->
    <div id="content-exposition" class="tab-content hidden space-y-6">
      <div id="creator-showcase-container"></div>
    </div>

  </main>

  <!-- MODAL ZOOM IMAGE HAUTE RÉSOLUTION -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md hidden flex items-center justify-center p-4 lg:p-10" onclick="closeImageModal()">
    <div class="relative max-w-6xl w-full max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <button onclick="closeImageModal()" class="absolute -top-12 right-0 px-4 py-2 rounded-xl bg-[#262b35] text-white hover:bg-[#f8485e] text-xs font-bold transition-all">
        Fermer (Échap)
      </button>
      <img id="modal-img" src="" alt="Zoom Planche" class="max-w-full max-h-[85vh] rounded-xl border border-[#262b35] shadow-2xl object-contain" />
    </div>
  </div>

  <!-- Conteneur Fixe des Notifications Toast Atelier -->
  <div id="atelier-toast-container" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none flex flex-col items-end"></div>

  <!-- Modale de Dialogue Métier Atelier -->
  <div id="atelier-dialog-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="card-black max-w-md w-full p-6 rounded-2xl space-y-5 border border-[#262b35] shadow-2xl relative">
      <div class="flex items-start gap-4">
        <div id="atelier-dialog-icon-wrap" class="w-10 h-10 rounded-xl bg-[#f8485e]/15 text-[#f8485e] flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div class="space-y-1.5 flex-1 min-w-0">
          <h3 id="atelier-dialog-title" class="font-bold text-base text-white">Notification Atelier</h3>
          <p id="atelier-dialog-message" class="text-xs text-slate-300 leading-relaxed"></p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 pt-3 border-t border-[#262b35]">
        <button id="atelier-dialog-cancel-btn" onclick="closeAtelierDialog(false)" class="hidden px-4 py-2 rounded-xl bg-[#111317] hover:bg-[#262b35] border border-[#262b35] text-xs font-semibold text-slate-300">
          Annuler
        </button>
        <button id="atelier-dialog-confirm-btn" onclick="closeAtelierDialog(true)" class="px-5 py-2 rounded-xl bg-[#f8485e] text-white text-xs font-bold">
          Compris
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts Modulaires (< 300 lignes par fichier) -->
  <script src="js/courses-dessin-01.js"></script>
  <script src="js/courses-dessin-02.js"></script>
  <script src="js/courses-graphisme-01.js"></script>
  <script src="js/courses-graphisme-02.js"></script>
  <script src="js/courses-graphisme-03.js"></script>
  <script src="js/sessions-data.js"></script>
  <script src="js/courses-data.js"></script>
  <script src="js/app-course-views.js"></script>
  <script src="js/app-core.js"></script>
  <script src="js/app-custom-ui.js"></script>
  <script src="js/app-submission.js"></script>
  <script src="js/stage-lessons-data.js"></script>
  <script src="js/app-admin-dashboard.js"></script>
  <script src="js/app-stagiaire-dashboard.js"></script>
  <script src="js/techniques-data.js"></script>
  <script src="js/app-techniques-view.js"></script>
  <script src="js/metiers-data-01.js"></script>
  <script src="js/metiers-data-02.js"></script>
  <script src="js/metiers-data.js"></script>
  <script src="js/app-metiers-view.js"></script>
  <script src="js/app-veille-showcase.js"></script>
  <script src="js/app-users-directory.js"></script>
  <script src="js/app-roles-stage.js"></script>
  <script src="js/app-courses.js"></script>
  <script src="js/app-easter-egg.js"></script>
  <script src="js/app-tools.js"></script>
  <script src="js/app-backend.js"></script>
</body>
</html>
